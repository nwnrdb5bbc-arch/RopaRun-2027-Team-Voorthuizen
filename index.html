<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sponsor een kilometer - RopaRun 2027</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: #17324d;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #dceaf2;
    }

    .leaflet-container {
      overflow: hidden;
      outline: 0;
    }

    .panel {
      position: absolute;
      z-index: 1000;
      top: 12px;
      left: 12px;
      max-width: 360px;
      background: #fff;
      padding: 14px 16px;
      border-radius: 12px;
      box-shadow: 0 3px 16px rgba(0,0,0,.2);
    }

    .searchrow {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .searchrow input {
      min-width: 0;
      flex: 1;
      padding: 9px 10px;
      border: 1px solid #b8c2cc;
      border-radius: 7px;
      font-size: 14px;
    }

    .searchrow button {
      padding: 9px 12px;
      border: 0;
      border-radius: 7px;
      background: #17324d;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 6px;
    }

    .panel p {
      font-size: 14px;
      line-height: 1.35;
      margin: 5px 0;
    }

    .legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 13px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
      vertical-align: -1px;
    }

    .green { background: #22a447; }
    .red { background: #d93025; }

    .counter {
      font-weight: 700;
      margin-top: 8px;
    }

    .leaflet-popup-content {
      margin: 12px 14px;
      min-width: 210px;
    }

    .popup-title {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .sponsor {
      display: inline-block;
      margin-top: 8px;
      padding: 9px 12px;
      background: #1677ff;
      color: white !important;
      text-decoration: none;
      border-radius: 7px;
      font-weight: 700;
    }

    .done {
      color: #b3261e;
      font-weight: 700;
    }

    .hint {
      font-size: 12px;
      color: #52606d;
      margin-top: 6px;
    }

    .donor-box {
      margin-top: 10px;
      padding: 8px 10px;
      background: #f5f7fa;
      border: 1px solid #dfe6ee;
      border-radius: 8px;
    }

    .donor-box div + div {
      margin-top: 4px;
    }

    @media (max-width: 600px) {
      .panel {
        top: 8px;
        right: 8px;
        left: 8px;
        max-width: none;
        padding: 10px 12px;
      }

      .panel p { display: none; }

      h1 {
        font-size: 16px;
        margin-bottom: 3px;
      }

      .legend { margin-top: 4px; }
      .searchrow { margin-top: 6px; }
      .searchrow input, .searchrow button { padding: 10px; }
      .counter { font-size: 13px; margin-top: 5px; }

      .leaflet-control-zoom {
        margin-top: 145px !important;
      }
    }
  </style>
</head>

<body>
  <div class="panel">
    <h1>Sponsor een kilometer - 2027</h1>
    <p>Klik op een groene kilometer om deze te sponsoren. Het kilometernummer wordt gekopieerd en daarna opent het Microsoft Forms-formulier.</p>
    <div class="legend">
      <span><i class="dot green"></i>Beschikbaar</span>
      <span><i class="dot red"></i>Gedoneerd</span>
    </div>

    <div class="searchrow">
      <input id="kmSearch" type="number" min="0" max="557" step="1" placeholder="Zoek kilometer 0-557">
      <button id="kmSearchBtn" type="button">Zoek</button>
    </div>

    <div class="counter" id="counter"></div>
  </div>

  <div id="map"></div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Houd je bestaande POINTS-array exact zoals die nu is.
    // Deze mag niet aangepast worden; alleen deze array wordt gebruikt.
    const POINTS = [
      // Plaats hier je bestaande route-array
      // Bijvoorbeeld:
      // {"nr":1,"km":0,"lat":52.272153,"lon":6.899132},
      // {"nr":2,"km":1,"lat":52.26478,"lon":6.897594}
    ];

    const FORMS_URL = 'https://forms.cloud.microsoft/e/6mfbpsLH3i';
    let donated = new Set();
    let donorInfo = {};

    const map = L.map('map', { preferCanvas: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap-bijdragers'
    }).addTo(map);

    const route = L.polyline(
      POINTS.map(p => [p.lat, p.lon]),
      { color: '#2364aa', weight: 3, opacity: 0.65 }
    ).addTo(map);

    function fitWholeRoute() {
      map.invalidateSize({ pan: false });
      map.fitBounds(route.getBounds(), {
        padding: [35, 35],
        maxZoom: 11,
        animate: false
      });
    }

    requestAnimationFrame(() => requestAnimationFrame(fitWholeRoute));
    window.addEventListener('load', () => setTimeout(fitWholeRoute, 250));
    window.addEventListener('resize', () => {
      clearTimeout(window._mapResizeTimer);
      window._mapResizeTimer = setTimeout(() => {
        map.invalidateSize({ pan: false });
      }, 150);
    });

    const layer = L.layerGroup().addTo(map);

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function updateCounter() {
      document.getElementById('counter').textContent =
        `${POINTS.length - donated.size} beschikbaar | ${donated.size} gedoneerd`;
    }

    function sponsor(km) {
      const text = `Kilometer ${km}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
      window.open(FORMS_URL, '_blank', 'noopener,noreferrer');
    }

    let markerByKm = new Map();

    function draw() {
      layer.clearLayers();
      markerByKm.clear();

      POINTS.forEach(p => {
        const isDone = donated.has(p.km);
        const marker = L.circleMarker(
          [p.lat, p.lon],
          {
            radius: 6,
            color: isDone ? '#a61b13' : '#116329',
            weight: 1.5,
            fillColor: isDone ? '#d93025' : '#22a447',
            fillOpacity: 0.92
          }
        );

        let html = `<div class="popup-title">Kilometer ${p.km}</div>`;

        if (isDone) {
          html += `<div class="done">Deze kilometer is al gedoneerd.</div>`;

          const donor = donorInfo[String(p.km)] || donorInfo[Number(p.km)] || {};
          const donorName = donor && donor.naam ? String(donor.naam).trim() : '';
          const donorMessage = donor && donor.boodschap ? String(donor.boodschap).trim() : '';

          if (donorName || donorMessage) {
            html += `<div class="donor-box">`;
            if (donorName) {
              html += `<div><strong>Donateur:</strong> ${escapeHtml(donorName)}</div>`;
            }
            if (donorMessage) {
              html += `<div><strong>Boodschap:</strong> ${escapeHtml(donorMessage)}</div>`;
            }
            html += `</div>`;
          }
        } else {
          html += `
            <div>Deze kilometer is nog beschikbaar.</div>
            <a class="sponsor" href="#" onclick="sponsor(${p.km}); return false;">
              Sponsor deze kilometer
            </a>
            <div class="hint">
              Kilometer ${p.km} wordt naar het klembord gekopieerd.
            </div>`;
        }

        marker.bindPopup(html).addTo(layer);
        markerByKm.set(Number(p.km), marker);
      });

      updateCounter();
    }

    function goToKm() {
      const raw = document.getElementById('kmSearch').value;
      const km = Number(raw);
      const marker = markerByKm.get(km);

      if (!Number.isInteger(km) || !marker) {
        alert('Vul een kilometer in van 0 t/m 557.');
        return;
      }

      map.setView(marker.getLatLng(), 15, { animate: true });
      marker.openPopup();
    }

    document.getElementById('kmSearchBtn').addEventListener('click', goToKm);
    document.getElementById('kmSearch').addEventListener('keydown', e => {
      if (e.key === 'Enter') goToKm();
    });

    // JSON laden
    fetch('donated-kilometers.json', { cache: 'no-store' })
      .then(response => {
        if (!response.ok) {
          throw new Error('Donatiebestand niet beschikbaar.');
        }
        return response.json();
      })
      .then(data => {
        const source = data && typeof data === 'object' ? data : {};
        const kilometers = Array.isArray(source)
          ? source
          : (Array.isArray(source.gedoneerd) ? source.gedoneerd : []);

        donorInfo =
          source.donateurs && typeof source.donateurs === 'object'
            ? source.donateurs
            : {};

        donated = new Set(kilometers.map(Number));
        draw();
      })
      .catch(() => {
        donated = new Set();
        donorInfo = {};
        draw();
      });
  </script>
</body>
</html>
