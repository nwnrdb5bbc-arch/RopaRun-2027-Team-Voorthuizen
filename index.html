<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sponsor een kilometer - 2027</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { height: 100%; margin: 0; font-family: Segoe UI, Arial, sans-serif; color: #17324d; }
    #app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
    header {
      background: #173f67; color: white; padding: 14px 18px;
      display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
      box-shadow: 0 2px 8px #0003; z-index: 1000;
    }
    header h1 { font-size: 20px; margin: 0; }
    .sub { opacity: .9; font-size: 13px; }
    .stats { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
    .pill { background: #ffffff18; border: 1px solid #ffffff38; border-radius: 18px; padding: 6px 11px; font-size: 13px; }
    .controls { background: white; padding: 8px 12px; border-radius: 8px; display: flex; gap: 7px; }
    input { border: 0; outline: 0; width: 105px; font-size: 14px; }
    button {
      border: 0; border-radius: 6px; padding: 7px 10px; cursor: pointer;
      background: #f4a024; color: #17324d; font-weight: 700;
    }
    #map { height: 100%; }
    .legend {
      background: white; padding: 9px 12px; border-radius: 8px;
      box-shadow: 0 1px 6px #0003; line-height: 1.7; font-size: 12px;
    }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .avail { background: #1f9d55; }
    .sold { background: #d64545; }
    .popup h3 { margin: 0 0 8px; color: #173f67; }
    .price { font-size: 18px; font-weight: 700; color: #1f9d55; }
    .cta {
      display: block; margin-top: 10px; padding: 8px; text-align: center;
      background: #f4a024; color: #17324d !important; text-decoration: none;
      border-radius: 6px; font-weight: 700;
    }
    .note { font-size: 11px; color: #667; margin-top: 7px; max-width: 220px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div>
        <h1>Sponsor een kilometer - 2027</h1>
        <div class="sub">Kies een kilometer van de route en steun het inschrijfgeld voor 2027.</div>
      </div>
      <div class="controls">
        <input id="km" type="number" min="0" max="557" step="1" placeholder="Km 0-557">
        <button onclick="goKm()">Zoek km</button>
      </div>
      <div class="stats">
        <span class="pill"><b>558</b> kilometers</span>
        <span class="pill"><b>€10</b> per km</span>
        <span class="pill">Potentieel <b>€5.580</b></span>
      </div>
    </header>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const sponsoredKm = new Set([550]);
    const data = [];

    for (let km = 0; km <= 557; km++) {
      const latBase = 52.25 + (km / 557) * 0.32;
      const lonBase = 6.88 + (km / 557) * 0.22;
      const lat = latBase + Math.sin(km / 18) * 0.012;
      const lon = lonBase + Math.cos(km / 16) * 0.014;
      data.push({
        km: Number(km),
        lat,
        lon,
        status: sponsoredKm.has(km) ? 'gesponsord' : 'beschikbaar',
        bedrag: 10
      });
    }

    const map = L.map('map', { preferCanvas: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap-bijdragers'
    }).addTo(map);

    const route = L.polyline(data.map(p => [p.lat, p.lon]), {
      color: '#2767a8',
      weight: 4,
      opacity: 0.75
    }).addTo(map);
    map.fitBounds(route.getBounds(), { padding: [20, 20] });

    const markers = {};
    data.forEach(p => {
      const sold = p.status === 'gesponsord';
      const m = L.circleMarker([p.lat, p.lon], {
        radius: 5,
        color: '#fff',
        weight: 1,
        fillColor: sold ? '#d64545' : '#1f9d55',
        fillOpacity: 0.95
      }).addTo(map);

      let action = sold
        ? '<b>Deze kilometer is al gesponsord.</b>'
        : '<span class="price">€10</span><div class="note">Noteer kilometer ' + p.km.toFixed(0) + ' en rond je sponsoring af via het formulier.</div><a class="cta" target="_blank" rel="noopener noreferrer" href="https://forms.cloud.microsoft/e/6mfbpsLH3i">Sponsor kilometer ' + p.km.toFixed(0) + '</a>';

      m.bindPopup('<div class="popup"><h3>Kilometer ' + p.km.toFixed(0) + '</h3>' + action + '<div class="note">GPS: ' + p.lat.toFixed(6) + ', ' + p.lon.toFixed(6) + '</div></div>');
      markers[p.km.toFixed(0)] = m;
    });

    function goKm() {
      const k = document.getElementById('km').value;
      if (markers[k]) {
        map.setView(markers[k].getLatLng(), 15);
        markers[k].openPopup();
      }
    }

    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = () => {
      const d = L.DomUtil.create('div', 'legend');
      d.innerHTML = '<b>Status</b><br><span class="dot avail"></span>Beschikbaar<br><span class="dot sold"></span>Gesponsord<br><span style="color:#2767a8">●</span> Route';
      return d;
    };
    legend.addTo(map);
  </script>
</body>
</html>
