data.forEach(p=>{const sold=p.status==='gesponsord';const m=L.circleMarker([p.lat,p.lon],{radius:5,color:'#fff',weight:1,fillColor:sold?'#d64545':'#1f9d55',fillOpacity:.95}).addTo(map);
let action=sold?'<b>Deze kilometer is al gesponsord.</b>':'<span class="price">€10</span><div class="note">Noteer kilometer '+p.km.toFixed(0)+' en rond je sponsoring af via het formulier.</div><a class="cta" target="_blank" rel="noopener noreferrer" href="https://forms.cloud.microsoft/e/6mfbpsLH3i">Sponsor kilometer '+p.km.toFixed(0)+' voor €10</a>';
m.bindPopup('<div class="popup"><h3>Kilometer '+p.km.toFixed(0)+'</h3>'+action+'<div class="note">GPS: '+p.lat.toFixed(6)+', '+p.lon.toFixed(6)+'</div></div>');markers[p.km.toFixed(0)]=m;});
function goKm(){const k=document.getElementById('km').value;if(markers[k]){map.setView(markers[k].getLatLng(),15);markers[k].openPopup();}}
const legend=L.control({position:'bottomright'});legend.onAdd=()=>{let d=L.DomUtil.create('div','legend');d.innerHTML='<b>Status</b><br><span class="dot avail"></span>Beschikbaar<br><span class="dot sold"></span>Gesponsord<br><span style="color:#2767a8">━</span> Route';return d;};legend.addTo(map);
</script></body></html>
