function fitWholeRoute(){map.invalidateSize({pan:false});map.fitBounds(route.getBounds(),{padding:[35,35],maxZoom:11,animate:false})} requestAnimationFrame(()=>requestAnimationFrame(fitWholeRoute)); window.addEventListener('load',()=>setTimeout(fitWholeRoute,250)); window.addEventListener('resize',()=>setTimeout(()=>map.invalidateSize({pan:false}),150));
function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML} function updateCounter(){document.getElementById('counter').textContent=`${POINTS.length-donated.size} beschikbaar | ${donated.size} gedoneerd`}

function draw(){layer.clearLayers();markerByKm.clear();POINTS.forEach(p=>{const d=donated.get(Number(p.km));const done=!!d;const m=L.circleMarker([p.lat,p.lon],{radius:6,color:done?'#a61b13':'#116329',weight:1.5,fillColor:done?'#d93025':'#22a447',fillOpacity:.92});let h=`<div class="popup-title">Kilometer ${p.km}</div>`;if(done){const naam=esc(d.naam||'Anonieme donateur');const msg=esc(d.boodschap||'');h+=`<div class="done">Deze kilometer is gedoneerd.</div><div class="donorbox"><div class="donorname">Donateur: ${naam}</div>${msg?`<div class="donormsg">“${msg}”</div>`:''}</div>`}else{h+=`<div>Deze kilometer is nog beschikbaar.</div><a class="sponsor" href="#" onclick="sponsor(${p.km});return false;">Sponsor deze kilometer</a><div class="hint">Kilometer ${p.km} wordt naar het klembord gekopieerd.</div>`}m.bindPopup(h).addTo(layer);markerByKm.set(Number(p.km),m)});updateCounter()}
function goToKm(){const km=Number(document.getElementById('kmSearch').value);const m=markerByKm.get(km);if(!Number.isInteger(km)||!m){alert('Vul een kilometer in van 0 t/m 557.');return}map.setView(m.getLatLng(),15,{animate:true});m.openPopup()} document.getElementById('kmSearchBtn').addEventListener('click',goToKm);document.getElementById('kmSearch').addEventListener('keydown',e=>{if(e.key==='Enter')goToKm()});
